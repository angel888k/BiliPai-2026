name: PerfGuard

# 性能守卫：只跑纯 JVM 断言，不需要设备、不需要任何 secret。
#
# 为什么单独开一个 workflow 而不是塞进 Build.yml：
# Build.yml 以 `secrets.FCM` 是否存在作为前置条件，fork 上来的 PR 会整个跳过。
# 性能守卫恰恰最需要在外部 PR 上生效，所以必须与 secret 解耦。
#
# 为什么不在这里跑 macrobenchmark：
# Pixel 6 API 31 的 GMD 冷启 + 全部 benchmark 类大约 25–40 分钟，且在 hosted runner
# 上 p99 抖动可达 ±40%。放进 PR 门禁的结果一定是所有人开始反复 rerun 直到变绿，
# 门禁随即失去意义。设备侧数据走真机采集脚本，由维护者人工比较。

on:
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perfguard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-guards:
    name: JVM 性能守卫
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # PerfGuard 只验证会直接影响帧时间、GPU 合成或运行时降级策略的断言。
      # 架构迁移、DataStore key 所有权和样式规范有不同的失败语义，不能伪装成性能
      # 回归并阻断不相关 PR；它们应由对应的专项检查处理。
      - name: 帧预算与运行时视觉守卫
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.android.purebilibili.core.ui.perf.FrameBudgetLintTest' \
            --tests 'com.android.purebilibili.core.ui.performance.*' \
            --tests 'com.android.purebilibili.core.ui.adaptive.RuntimeVisualGuard*'

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perfguard-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7
